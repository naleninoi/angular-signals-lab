<div class="page">
    <header class="header">
        <div class="logo">⚡ Angular Signals Lab</div>
        <span class="version">Angular 22</span>
    </header>

    <main>
        <section class="hero">
            <h1>Учимся работать с Signals</h1>

            <p>
                Практический мини-курс по современной реактивности Angular. От основ до рефакторинга legacy-приложений.
            </p>

            <div class="tags">
                <span>8 уроков</span>
                <span>Практика и рефакторинг</span>
            </div>
        </section>

        <section class="lessons">
            <h2>Уроки</h2>

            @for (lesson of lessons; track $index) {
                <div class="lesson">
                    <span class="number">
                        {{ $index + 1 }}
                    </span>

                    <span class="name">
                        {{ lesson }}
                    </span>

                    <span class="status"> Скоро </span>
                </div>
            }
        </section>
    </main>
</div>
