<section class="product-selector">
    <h2>Выбор товара</h2>
    <div class="product-selector__categories">
        <button type="button" (click)="setCategory('electronics')">Электроника</button>
        <button type="button" (click)="setCategory('furniture')">Мебель</button>
    </div>
    <div class="product-selector__products">
        @for (product of availableProducts(); track product.id) {
            <button type="button" (click)="selectProduct(product)">
                {{ product.name }} — {{ product.price }}
            </button>
        } @empty {
            <p>Нет доступных товаров</p>
        }
    </div>
    <div class="product-selector__selected">
        <h3>Выбранный товар</h3>
        <!-- TODO: Вывести selectedProduct и обработать отсутствие выбранного товара. -->
        <button type="button" (click)="removeSelectedProduct()">Удалить выбранный товар</button>
    </div>
</section>
