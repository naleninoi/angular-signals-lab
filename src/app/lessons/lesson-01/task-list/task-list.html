<div class="task-list">
    <div class="task-form">
        <input
            type="text"
            [ngModel]="newTaskTitle()"
            (ngModelChange)="onNewTaskTitleChange($event)"
            (keyup.enter)="addTask()"
            placeholder="Название новой задачи"
            aria-label="Название новой задачи" />

        <button
            type="button"
            (click)="addTask()">
            Добавить
        </button>
    </div>

    <ul>
        @for (task of tasks(); track task.id) {
            <li>
                <label>
                    <input
                        type="checkbox"
                        [checked]="task.completed"
                        (change)="toggleTask(task.id)" />
                    <span [class.completed]="task.completed">
                        {{ task.title }}
                    </span>
                </label>

                <button
                    type="button"
                    class="delete-button"
                    (click)="removeTask(task.id)">
                    Удалить
                </button>
            </li>
        }
    </ul>

    @if (tasks().length === 0) {
        <p class="empty-state">Список задач пуст</p>
    }
</div>
