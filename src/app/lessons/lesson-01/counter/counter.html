
<div class="counter">
    <p class="counter-value">
        Текущее значение: {{ count }}
    </p>

    <div class="counter-actions">
        <button
            type="button"
            (click)="decrement()"
            [disabled]="count <= 0">
            −
        </button>

        <button
            type="button"
            (click)="increment()"
            [disabled]="count >= 10">
            +
        </button>

        <button
            type="button"
            (click)="reset()">
            Сбросить
        </button>
    </div>

    <p class="counter-hint">
        Допустимый диапазон: 0–10
    </p>
</div>
