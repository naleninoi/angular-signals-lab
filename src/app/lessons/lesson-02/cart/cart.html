<section class="panel">
    <h3>Корзина</h3>
    @for (item of items(); track item.id) {
        <div class="item">
            <span>{{ item.name }} — {{ item.price }} ₽</span>
            <div class="actions">
                <button type="button" (click)="changeQuantity(item.id, -1)">−</button>
                <span>{{ item.quantity }}</span>
                <button type="button" (click)="changeQuantity(item.id, 1)">+</button>
            </div>
        </div>
    }
    <label>
        Скидка, %
        <input type="number" min="0" max="100" [value]="discountPercent()" (input)="changeDiscount($event)" />
    </label>
    <div class="summary">
        <!-- TODO: вывести subtotal(), totalQuantity(), discountAmount(), total(). -->
        <p>Добавь вычисляемые показатели в шаблон.</p>
    </div>
</section>
